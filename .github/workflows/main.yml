name: examen-workflow

on:
  push:
    branches:
      - nueva-caracteristica

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1) Descargar código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Configurar Python 3.10
      - name: Setup Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: 3.10

      # 3) Instalar pytest y ejecutar tests
      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest test.py

      # 4) Construir imagen Docker (local, sin push)
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: examen-wallet:latest
